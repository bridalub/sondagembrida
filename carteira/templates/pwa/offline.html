{% load static %}<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{{ tema }}">
<meta name="robots" content="noindex">
<title>Sem conexão · {{ nome }}</title>
<link rel="icon" href="{% static 'brida/pwa/prospeccao-32.png' %}">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f4fa; color: #161a3d; }
  .caixa { max-width: 420px; width: 100%; background: #fff; border: 1px solid #dfe2ef; border-radius: 14px;
           padding: 32px 24px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: #4a5078; line-height: 1.5; }
  button { font: inherit; font-weight: 700; background: #EE662F; color: #161a3d; border: 0; border-radius: 8px;
           min-height: 44px; padding: 9px 20px; cursor: pointer; }
  button:hover { background: #e2571f; }
  button:focus-visible { outline: 3px solid #21275A; outline-offset: 2px; }
</style>
</head>
<body>
<main class="caixa">
  <img src="{% static icone %}" alt="" width="64" height="64">
  <h1>Sem conexão</h1>
  <p>O {{ nome }} precisa de internet para funcionar. Reconecte e tente de novo. Nada do que já foi gravado se perdeu.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
