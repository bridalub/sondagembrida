# /etc/nginx/sites-available/brida  (troque prospeccao.exemplo.com.br pelo dominio real)
server {
    listen 80;
    server_name prospeccao.exemplo.com.br;

    client_max_body_size 20m;   # importacao de CSV

    location /static/ {
        alias /opt/brida-prospeccao/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# HTTPS: sudo certbot --nginx -d prospeccao.exemplo.com.br
