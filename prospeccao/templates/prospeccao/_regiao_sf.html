{% if r %}<div class="is-regiao" title="Indicação pela região no Salesforce ({{ r.base }}{% if r.tipo %}, vendedores de {{ r.tipo }}{% endif %}): {{ r.vendedor }} atende {{ r.vend_contas }} de {{ r.contas }} conta{{ r.contas|pluralize }} de vendedores de rua; o coordenador é o desse vendedor."><span>Coordenador: <b>{{ r.coordenador|default:"—" }}</b></span><span>Vendedor: <b>{{ r.vendedor|default:"—" }}</b></span>{% if r.dividida %}<span class="is-regiao-aviso">região dividida</span>{% endif %}</div>{% else %}<div class="is-regiao vazio" title="Não há contas de vendedores de rua do Salesforce nesta faixa de CEP nem neste município.">Coordenador/vendedor: sem vendedor de rua do Salesforce na região</div>{% endif %}
