{% if r %}<div class="is-regiao" title="Indicação pela região no Salesforce: {{ r.contas }} conta{{ r.contas|pluralize }} em {{ r.base }}{% if r.regiao %} ({{ r.regiao }}){% endif %}. Coordenador em {{ r.coord_pct }}% e vendedor em {{ r.vend_pct }}% dessas contas."><span>Coordenador: <b>{{ r.coordenador|default:"—" }}</b></span><span>Vendedor: <b>{{ r.vendedor|default:"—" }}</b></span></div>{% else %}<div class="is-regiao vazio" title="Não há contas do Salesforce neste município nem nesta faixa de CEP.">Coordenador/vendedor: sem conta do Salesforce na região</div>{% endif %}
