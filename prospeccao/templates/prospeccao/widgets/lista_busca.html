{% with w=widget %}
<div class="lb" data-lb data-nome="{{ w.name }}" data-vazio="{{ w.vazio }}"{% if w.permitir_novo %} data-novo{% endif %}>
  <button type="button" class="lb-botao" id="{{ w.attrs.id }}_botao" aria-haspopup="true" aria-expanded="false"
          aria-controls="{{ w.attrs.id }}_painel">
    <span class="lb-resumo">{{ w.vazio }}</span>
    <span class="lb-cont" aria-hidden="true">{% if w.n_marcados %}{{ w.n_marcados }}{% endif %}</span>
    <svg class="lb-seta" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <div class="lb-painel" id="{{ w.attrs.id }}_painel" hidden>
    <input type="search" class="lb-busca" placeholder="{{ w.placeholder }}" autocomplete="off"
           aria-label="{{ w.placeholder }}">
    <div class="lb-lista" role="group" aria-label="Opções">
      {% for o in w.opcoes %}
      <label class="lb-item"><input type="checkbox" name="{{ w.name }}" value="{{ o.value }}"{% if o.checked %} checked{% endif %}>
        <span>{{ o.label }}</span></label>
      {% endfor %}
      <p class="lb-nada" hidden>Nada encontrado{% if w.permitir_novo %}. Enter acrescenta o que foi digitado.{% endif %}</p>
    </div>
    <div class="lb-rodape">
      <button type="button" class="lb-todos">Todos</button>
      <span class="lb-info" aria-live="polite"></span>
      <button type="button" class="lb-limpar">Limpar</button>
    </div>
  </div>
</div>
{% endwith %}
<script>
(function () {
  if (window.__listaBusca) { window.__listaBusca(); return; }
  var css = document.createElement("style");
  css.textContent = [
    ".lb{position:relative;max-width:560px}",
    ".lb button.lb-botao{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:8px 12px;background:var(--card,#fff);",
    "color:var(--tx,#1c2033);border:1px solid var(--campo-bd,#858ca3);border-radius:8px;font:inherit;font-weight:400;text-align:left;cursor:pointer;box-shadow:none}",
    ".lb button.lb-botao:hover{background:var(--azul-50,#f3f4fa);color:var(--tx,#1c2033)}",
    ".lb-botao:focus-visible{outline:3px solid var(--laranja,#EE662F);outline-offset:2px}",
    ".lb-resumo{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
    ".lb-cont{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--azul-100,#e8eaf5);color:var(--azul,#21275A);font-size:12px;font-weight:600;text-align:center}",
    ".lb-cont:empty{display:none}",
    ".lb-seta{flex:none;color:var(--mut,#5a6175)}",
    ".lb-painel{position:absolute;z-index:30;left:0;right:0;margin-top:4px;background:var(--card,#fff);border:1px solid var(--bd-forte,#c6cad8);",
    "border-radius:10px;box-shadow:0 10px 30px rgba(22,26,61,.16);padding:8px}",
    ".lb-busca{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--bd,#e2e5ee);border-radius:8px;background:var(--laranja-suave,#fdeee6);font:inherit}",
    ".lb-lista{max-height:280px;overflow:auto;margin:6px 0;padding-right:2px}",
    ".lb-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--azul-900,#161a3d)}",
    ".lb [hidden]{display:none!important}",
    ".lb-item:hover{background:var(--azul-50,#f3f4fa)}",
    ".lb-item input{width:18px;height:18px;flex:none;accent-color:var(--azul,#21275A)}",
    ".lb-nada{margin:8px;color:var(--mut,#5a6175);font-size:13px}",
    ".lb-rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--bd,#e2e5ee);padding-top:8px}",
    ".lb .lb-rodape button{background:none;box-shadow:none;border:0;font:inherit;font-weight:600;color:var(--azul,#21275A);cursor:pointer;padding:6px 8px;border-radius:6px}",
    ".lb .lb-rodape button:hover{background:var(--azul-50,#f3f4fa)}",
    ".lb-info{color:var(--mut,#5a6175);font-size:12px}",
    "@media (max-width:600px){.lb{max-width:none}}"
  ].join("");
  document.head.appendChild(css);
  function semAcento(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function iniciar(el) {
    if (el.__ok) return; el.__ok = true;
    var botao = el.querySelector(".lb-botao"), painel = el.querySelector(".lb-painel"),
        busca = el.querySelector(".lb-busca"), lista = el.querySelector(".lb-lista"),
        nada = el.querySelector(".lb-nada"), info = el.querySelector(".lb-info"), nome = el.dataset.nome;
    function itens() { return Array.prototype.slice.call(lista.querySelectorAll(".lb-item")); }
    function resumo() {
      var marc = itens().filter(function (i) { return i.querySelector("input").checked; })
                        .map(function (i) { return i.textContent.trim(); });
      el.querySelector(".lb-resumo").textContent = marc.length ? marc.slice(0, 3).join(", ") + (marc.length > 3 ? "…" : "") : el.dataset.vazio;
      el.querySelector(".lb-cont").textContent = marc.length ? String(marc.length) : "";
      info.textContent = marc.length + " de " + itens().length;
    }
    function filtrar() {
      var q = semAcento(busca.value.trim()), vis = 0;
      itens().forEach(function (i) { var ok = !q || semAcento(i.textContent).indexOf(q) >= 0; i.hidden = !ok; vis += ok; });
      nada.hidden = vis > 0;
    }
    function abrir(sim) {
      painel.hidden = !sim; botao.setAttribute("aria-expanded", sim ? "true" : "false");
      if (sim) { busca.focus(); }
    }
    botao.addEventListener("click", function () { abrir(painel.hidden); });
    busca.addEventListener("input", filtrar);
    busca.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") { abrir(false); botao.focus(); }
      if (ev.key === "Enter") {
        ev.preventDefault();
        var v = busca.value.trim();
        if (!v) return;
        var vis = itens().filter(function (i) { return !i.hidden; });
        if (vis.length === 1) { vis[0].querySelector("input").checked = true; }
        else if (!vis.length && el.hasAttribute("data-novo")) {
          var lab = document.createElement("label"); lab.className = "lb-item";
          var cb = document.createElement("input"); cb.type = "checkbox"; cb.name = nome; cb.value = v; cb.checked = true;
          var sp = document.createElement("span"); sp.textContent = v;
          lab.appendChild(cb); lab.appendChild(sp); lista.insertBefore(lab, lista.firstChild);
        }
        busca.value = ""; filtrar(); resumo();
      }
    });
    lista.addEventListener("change", resumo);
    el.querySelector(".lb-todos").addEventListener("click", function () {
      itens().forEach(function (i) { if (!i.hidden) i.querySelector("input").checked = true; }); resumo();
    });
    el.querySelector(".lb-limpar").addEventListener("click", function () {
      itens().forEach(function (i) { i.querySelector("input").checked = false; }); resumo();
    });
    document.addEventListener("click", function (ev) { if (!el.contains(ev.target)) abrir(false); });
    el.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !painel.hidden) { abrir(false); botao.focus(); } });
    resumo();
  }
  window.__listaBusca = function () {
    Array.prototype.forEach.call(document.querySelectorAll("[data-lb]"), iniciar);
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", window.__listaBusca);
  else window.__listaBusca();
})();
</script>
